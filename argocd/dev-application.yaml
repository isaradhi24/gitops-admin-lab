apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/isaradhi24/gitops-admin-lab.git
    targetRevision: main
    path: helm/custom-nginx-chart
    helm:
      releaseName: nginx-dev
      valueFiles:
        - ../../gitops/dev/values.yml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true