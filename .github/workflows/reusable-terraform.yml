name: Reusable Terraform Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Terraform environment: dev, qa, uat, prod"
        required: true
        type: string

      terraform_action:
        description: "Terraform action: validate"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_resource_group_name: rg-gitops-admin-${{ inputs.environment }}
      TF_VAR_location: eastus
      TF_VAR_acr_name: gitopsadminacr12345
      TF_VAR_environment: ${{ inputs.environment }}

      # Azure OIDC authentication for Terraform
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

    # Select the environment-specific Azure OIDC configuration.
    environment: infrastructure-${{ inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init With Azure Remote Backend
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=rg-terraform-state" \
            -backend-config="storage_account_name=stazclouddevopstfstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=gitops-admin/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ inputs.terraform_action == 'plan' }}
        run: terraform plan -input=false -no-color
