name: Azure OIDC Authenticaion Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure-login:
    name: Test Azure OIDC Login
    runs-on: ubuntu-latest
    environment: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Azure Environment Variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is missing or empty"
              exit 1
            fi
            echo "$variable is configured"
          done

      - name: Test Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Authentication
        run: |
          az account show \
             --query "{subscription:name,state:state}" \
             -o table
